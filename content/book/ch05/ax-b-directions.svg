<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Ax=b 的正向计算与反向求解</title>
  <desc id="desc">上方给定交点 x 等于二、三，代入两行得到 b 等于五、一；下方给定 b 等于五、一，通过两个方程的交集找回 x 等于二、三。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2878a5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#c4512d"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="12" fill="#f5f7f8"/>
  <text x="40" y="52" fill="#263746" font-family="sans-serif" font-size="24" font-weight="700">正向计算：给定交点，算出每行的结果</text>
  <rect x="52" y="82" width="190" height="92" rx="8" fill="#e3f0f7" stroke="#2878a5" stroke-width="2"/>
  <text x="147" y="116" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="17">给定点 x</text>
  <text x="147" y="149" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="25" font-weight="700">(2, 3)</text>
  <path d="M255 128H365" fill="none" stroke="#2878a5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="380" y="82" width="205" height="92" rx="8" fill="#e8eee8" stroke="#62836b" stroke-width="2"/>
  <text x="482" y="114" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="17">分别代入两行</text>
  <text x="482" y="147" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="18">2+3　　2×2−3</text>
  <path d="M598 128H708" fill="none" stroke="#c4512d" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="724" y="82" width="190" height="92" rx="8" fill="#f8e9e2" stroke="#c4512d" stroke-width="2"/>
  <text x="819" y="116" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="17">算得右端 b</text>
  <text x="819" y="149" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="25" font-weight="700">(5, 1)</text>

  <path d="M40 207H920" stroke="#d5dde2" stroke-width="1.5"/>
  <text x="40" y="251" fill="#263746" font-family="sans-serif" font-size="24" font-weight="700">反向求解：给定每行的目标，找交点</text>
  <rect x="52" y="280" width="190" height="92" rx="8" fill="#f8e9e2" stroke="#c4512d" stroke-width="2"/>
  <text x="147" y="314" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="17">给定目标 b</text>
  <text x="147" y="347" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="25" font-weight="700">(5, 1)</text>
  <path d="M255 326H365" fill="none" stroke="#c4512d" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="380" y="280" width="205" height="92" rx="8" fill="#e8eee8" stroke="#62836b" stroke-width="2"/>
  <text x="482" y="312" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="17">同时满足两行</text>
  <text x="482" y="345" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="18">x+y=5　2x−y=1</text>
  <path d="M598 326H708" fill="none" stroke="#2878a5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="724" y="280" width="190" height="92" rx="8" fill="#e3f0f7" stroke="#2878a5" stroke-width="2"/>
  <text x="819" y="314" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="17">交点 x</text>
  <text x="819" y="347" text-anchor="middle" fill="#263746" font-family="sans-serif" font-size="25" font-weight="700">(2, 3)</text>
</svg>
